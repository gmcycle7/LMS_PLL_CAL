name: Verification snapshot

# 每週重跑一次完整的 `npm run verify`（Vitest 全部測試 + pytest golden），再和已提交的
# src/data/verification-status.json 比對。網站上的「verified」徽章讀的就是這份快照，
# 如果程式或測試改了卻忘了重跑 verify，這個 workflow 會失敗並列出差異。
#
# - 不在 PR 上跑：完整的 Vitest（含 jsdom 整章 smoke test）在 GitHub runner 上要 10–20 分鐘，
#   逾時設定又長，見 ci.yml 檔頭的說明。
# - 失敗不影響部署（部署只等 ci.yml）。修法：本機 `npm run verify`、檢查 diff、提交快照；
#   或下載這次執行附上的 verification-status artifact，覆蓋 src/data/verification-status.json 後提交。
# - 排程只會在預設分支上跑；公開 repo 超過 60 天沒有任何活動時 GitHub 會自動停用排程，需手動重新啟用。
on:
  schedule:
    - cron: '0 2 * * 1' # 每週一 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-status
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: golden/requirements.txt
      - run: npm ci
      - run: pip install -r golden/requirements.txt
      - name: Keep the committed snapshot for comparison
        run: cp src/data/verification-status.json "$RUNNER_TEMP/verification-status.committed.json"
      - name: Re-run the full verification
        run: node scripts/verify.mjs --strict
      - name: Upload the regenerated snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-status
          path: src/data/verification-status.json
          if-no-files-found: ignore
      - name: Compare with the committed snapshot
        run: node scripts/verify-status-check.mjs "$RUNNER_TEMP/verification-status.committed.json" src/data/verification-status.json
