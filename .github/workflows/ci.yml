name: CI

# 每個 pull request 與每次 push 到 main 都會跑。deploy.yml 會等這支 workflow 在 main 上成功才部署
# （workflow_run），所以壞掉的 commit 不會上線；緊急時仍可手動觸發 deploy.yml（workflow_dispatch）。
#
# Jobs（互相獨立、平行執行）：
#   fast    型別檢查、eslint、vite build、bundle 大小預算、verification 快照格式（約 3–4 分鐘）
#   audit   npm audit（只看會進網站的套件）。目前 continue-on-error，見該 job 的說明
#   python  Python golden model：pytest golden、export_vectors.py --check 與 --check-web、SSPLL golden（約 1–2 分鐘）
#   unit    Vitest 的 node project（`vitest run --project node`：src/**/*.test.ts，約 129 檔、2,800 項；本機 CPU 時間約 210 s）
#   ci-ok   把上面幾個 job 彙整成一個狀態，之後設 branch protection 只要勾這一個
#
# jsdom 環境的整章／整頁 smoke test（Vitest 的 jsdom project：src/**/*.test.tsx，約 150 檔、3,500 項）「不在」這支 workflow：
# 它們一次渲染整章的 KaTeX、Mermaid、手算題與 inline worker，單一測試的逾時設在 120–600 s，GitHub runner 只有 2–4 vCPU，
# 放進來會讓 PR 要等很久、還會因逾時偶發失敗。它們在 jsdom-tests.yml：push 到 main、每週一次、手動觸發，
# 用 `vitest run --project jsdom --shard=i/N` 切成多個 shard 平行跑，不擋 PR 也不擋部署。
# 改到章節或共用元件的 PR：本機跑 `npx vitest run <相關檔案> --maxWorkers=2`，或在 Actions 頁面手動觸發 jsdom tests 並選你的分支。
# （穩定一段時間之後，jsdom-tests 可以改成 PR 上只跑「有改到的檔案」；目前還沒有做。）

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一個分支／PR 有新的 push 時取消舊的執行。main 也一樣：舊 commit 的 CI 被取消，
# 就不會觸發它的部署，避免「舊 commit 的部署比新 commit 晚完成」。
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PYTHON_VERSION: '3.12'

jobs:
  fast:
    name: fast (typecheck, lint, build, bundle size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npx vite build
      # 預算與收緊方式見 scripts/check-bundle-size.mjs 檔頭。先跑 --self-test 確保判定邏輯本身沒壞。
      - name: Bundle size budget
        run: |
          node scripts/check-bundle-size.mjs --self-test
          node scripts/check-bundle-size.mjs dist
      # 網站上的 verified 徽章讀 src/data/verification-status.json；這裡只檢查快照的格式與有沒有失敗項目。
      # 快照是否過期（程式改了但沒重跑 `npm run verify`）由每週的 verify-status.yml 檢查。
      - name: Verification snapshot sanity
        run: |
          node scripts/verify-status-check.mjs --self-test
          node scripts/verify-status-check.mjs --sanity

  audit:
    name: audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TODO: 目前 `npm audit --omit=dev --audit-level=high` 會失敗（react-router-dom、mermaid、katex 等
    # 在 ^ 範圍內已有修正版，見 maintainability 評論的依賴升級 PR）。為了不讓每個 PR 一開始就紅燈，
    # 先 continue-on-error：這個 job 仍會顯示失敗，但不會擋住 workflow、也不會擋部署。
    # 升級完、`npm audit --omit=dev --audit-level=high` 在本機回傳 0 之後，刪掉下面這一行，並把 audit 加進 ci-ok 的 needs。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # npm audit 只讀 package-lock.json，不需要 npm ci。
      - run: npm audit --omit=dev --audit-level=high

  python:
    name: python (golden model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: golden/requirements.txt
      - run: pip install -r golden/requirements.txt
      - name: Golden model tests
        run: python3 -m pytest golden -q
      # 確認提交的 golden/vectors/*.json 與目前的 Python 模型一致（Vitest 讀的就是這些檔案）。
      - name: Golden vectors are up to date
        run: python3 golden/export_vectors.py --check
      # 網頁讀的資料 JSON（案例頁 params／pred_vs_sim…、golden vectors、presets）的結構，和 TypeScript 的 validate.ts 共用 src/data/golden/schemas.json。
      - name: Web data JSON matches the shared schemas
        run: python3 golden/export_vectors.py --check-web
      - name: SSPLL golden model tests
        working-directory: analysis/sspll/golden
        run: python3 -m pytest -q

  unit:
    name: unit (vitest, node environment)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # vite.config.ts 的 test.workspace 定義兩個 project：node（src/**/*.test.ts）與 jsdom（src/**/*.test.tsx）。
      # 這裡只跑 node project；jsdom 的整章 smoke test 見檔頭說明與 jsdom-tests.yml。
      - name: Vitest (node project)
        run: npx vitest run --project node

  ci-ok:
    name: ci-ok
    if: always()
    needs: [fast, python, unit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          echo "fast=${{ needs.fast.result }} python=${{ needs.python.result }} unit=${{ needs.unit.result }}"
          test "${{ needs.fast.result }}" = success
          test "${{ needs.python.result }}" = success
          test "${{ needs.unit.result }}" = success
